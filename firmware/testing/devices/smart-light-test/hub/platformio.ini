; =============================================================================
; Smart Light Bench Test - PlatformIO Configuration
; =============================================================================
;
; Partition tables live in system/partitions/ and are keyed by FLASH SIZE,
; not by board or device role. Each env picks the one matching its chip.
; Verify a new board with:  esptool.py --port COMx flash_id
;
; =============================================================================

[platformio]
default_envs = s3_wroom
src_dir = main

[env]
framework = espidf
monitor_speed = 115200
build_flags =
    -I../../../modules/smart-light
    -I../../../../components/addressable
    -I../../../../components/display/gc9a01
    -I../../../../components/display/shared
    -I../../../../components/touch
    -I../../../../components/encoder
    -I../../../../wireless/communication/esp_now
    -I../../../../system/message_protocol
    -I../../../../system/auto_pair
    -I../../../../system/config_store
    -I../../../../system/core_types

; ─── 4MB boards ──────────────────────────────────────────────────────────────

[env:c6_seeed]                          ; VERIFIED 4MB
platform = espressif32
board = seeed_xiao_esp32c6
board_build.partitions = ../../../../system/partitions/partitions_4mb.csv

[env:esp32d]                            ; unverified - check flash_id
platform = espressif32
board = esp32dev
board_build.partitions = ../../../../system/partitions/partitions_4mb.csv

; ─── 8MB boards ──────────────────────────────────────────────────────────────

[env:c6]                                ; unverified - check flash_id
platform = espressif32
board = esp32-c6-devkitc-1
board_build.partitions = ../../../../system/partitions/partitions_8mb.csv

[env:s3_seeed]                          ; unverified - check flash_id
platform = espressif32
board = seeed_xiao_esp32s3
board_build.partitions = ../../../../system/partitions/partitions_8mb.csv

; ─── 16MB boards ─────────────────────────────────────────────────────────────

[env:s3_wroom]                          ; VERIFIED 16MB
platform = espressif32
board = esp32-s3-devkitc-1
board_build.partitions = ../../../../system/partitions/partitions_16mb.csv
board_upload.flash_size = 16MB