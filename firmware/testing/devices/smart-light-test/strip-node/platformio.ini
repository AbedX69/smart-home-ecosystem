; =============================================================================
; Smart Light Bench Test - PlatformIO Configuration
; =============================================================================
;
; Bench-tests SmartLightRemote with 2 panels, 2 touch pads, 2 encoders,
; and 2 GC9A01 displays sharing one SPI bus.
;
; Default target is c6_seeed because the demo pins are ESP32-C6 specific.
; Other envs are provided for parity with the rest of the project.
;
; =============================================================================
 
[platformio]
default_envs = c6_seeed
src_dir = main

[env] 
framework = espidf
monitor_speed = 115200
build_flags =
    -I../../../modules/smart-light
    -I../../../../components/addressable
    -I../../../../components/display/gc9a01
    -I../../../../components/display/shared
    -I../../../../components/touch
    -I../../../../components/encoder
    -I../../../../wireless/communication/esp_now
    -I../../../../system/message_protocol
    -I../../../../system/auto_pair
    -I../../../../system/config_store
    -I../../../../system/core_types
    -I../../../../system/device_identity
    -I../../../../system/ota
    -I../../../../system/ota_bulk
 
[env:c6_seeed]                          ; VERIFIED 4MB
platform = espressif32
board = seeed_xiao_esp32c6
board_build.partitions = ../../../../system/partitions/partitions_4mb.csv

[env:esp32d]                            ; unverified - check flash_id
platform = espressif32
board = esp32dev
board_build.partitions = ../../../../system/partitions/partitions_4mb.csv

; ─── 8MB boards ──────────────────────────────────────────────────────────────

[env:c6]                                ; unverified - check flash_id
platform = espressif32
board = esp32-c6-devkitc-1
board_build.partitions = ../../../../system/partitions/partitions_8mb.csv

[env:s3_seeed]                          ; unverified - check flash_id
platform = espressif32
board = seeed_xiao_esp32s3
board_build.partitions = ../../../../system/partitions/partitions_8mb.csv

; ─── 16MB boards ─────────────────────────────────────────────────────────────

[env:s3_wroom]                          ; VERIFIED 16MB
platform = espressif32
board = esp32-s3-devkitc-1
board_build.partitions = ../../../../system/partitions/partitions_16mb.csv
